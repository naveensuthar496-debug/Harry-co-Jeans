# Upstream Private Backend Pool (Private network only - no public IP exposed)
upstream backend_upstream {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Plain HTTP (Port 80) - Enforce Strict Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name harryandcojeans.com www.harryandcojeans.com api.harryandcojeans.com;

    # Allow Let's Encrypt ACME challenge if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all plain HTTP requests permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Secure HTTPS (Port 443) - Reverse Proxy & Origin IP Masking
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harryandcojeans.com www.harryandcojeans.com api.harryandcojeans.com;

    # TLS Certificates & High-Security Ciphers (Mozilla Modern/Intermediate Guideline)
    ssl_certificate /etc/nginx/ssl/live/harryandcojeans.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/harryandcojeans.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS Protocols Only (Disallow SSLv3, TLSv1, TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # HSTS & Defensive Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;

    # Strip Internal Origin Fingerprints
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Default Upstream Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Health Check Endpoint for Azure Front Door and Edge Probes
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # Strict Rate-Limiting on Admin Login (Brute-Force Guard)
    location /api/v1/admin/login {
        limit_req zone=admin_auth_limit burst=3 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Checkout & Order Placement Protection
    location /api/v1/orders {
        limit_req zone=checkout_limit burst=5 nodelay;
        proxy_pass http://backend_upstream;
    }

    # General API Routes with Rate Limiting
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Admin Portal (Protected Route)
    location /admin {
        # Optional: Restrict to internal IP ranges or VPN if deployed behind gateway
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://backend_upstream;
    }

    # Storefront Static Assets and SPA Routes
    location / {
        proxy_pass http://backend_upstream;
        proxy_redirect off;

        # Cache static assets at proxy layer
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg)$ {
            proxy_pass http://backend_upstream;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
