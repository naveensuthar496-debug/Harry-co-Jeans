# HARRY & CO JEANS - PRODUCTION REVERSE PROXY CONFIGURATION (NGINX)
# Enforces Origin IP Masking, TLS 1.2/1.3, Rate Limiting, and WAF Edge Shielding

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide server version and fingerprint
    server_tokens off;

    # Enhanced Logging Format with Real Client IP and Edge Tracking
    log_format security_combined '$remote_addr - $http_x_azure_clientip [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'fdid="$http_x_azure_fdid"';

    access_log /var/log/nginx/access.log security_combined buffer=32k flush=5s;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Request Buffer & Size Restrictions (Buffer Overflow Protection)
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Rate Limiting Zones (Leaky Bucket)
    # 1. General API: 25 requests per second per IP with burst
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=25r/s;
    # 2. Sensitive Authentication & Admin: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=5r/m;
    # 3. Checkout & Orders: 10 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Include Virtual Host Configurations
    include /etc/nginx/conf.d/*.conf;
}
