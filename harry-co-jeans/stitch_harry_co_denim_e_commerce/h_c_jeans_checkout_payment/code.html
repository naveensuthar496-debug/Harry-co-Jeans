<!DOCTYPE html>

<html class="light" lang="en"><head>

              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",

              "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-20 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background border-b border-primary dark:border-outline-variant flex justify-between items-center px-margin-mobile md:px-xl h-20 w-full max-w-container-max mx-auto">
<button class="text-primary dark:text-on-background hover:opacity-70 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="text-headline-md font-headline-md tracking-tighter text-primary dark:text-on-background">HARRY &amp; CO JEANS</div>
<button class="text-primary dark:text-on-background hover:opacity-70 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</header>
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-xl py-xl flex flex-col items-center">
<!-- Stepper -->
<div class="w-full max-w-2xl mb-12 flex justify-center items-center space-x-4">
<div class="flex items-center text-on-surface-variant">
<span class="w-8 h-8 rounded-full border border-outline flex items-center justify-center text-label-sm font-label-sm">1</span>
<span class="ml-2 text-label-sm font-label-sm uppercase hidden md:inline">Address</span>
</div>
<div class="h-px w-8 bg-outline-variant"></div>
<div class="flex items-center text-primary font-bold">
<span class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-label-sm font-label-sm">2</span>
<span class="ml-2 text-label-sm font-label-sm uppercase">Payment</span>
</div>
</div>
<div class="w-full max-w-2xl space-y-8">
<!-- Order Summary Collapsed -->
<details class="group border border-primary p-md rounded-lg cursor-pointer">
<summary class="flex justify-between items-center font-headline-md text-headline-md list-none">
<span>Order Summary (3 items)</span>
<div class="flex items-center gap-4">
<span>$345.00</span>
<span class="material-symbols-outlined group-open:rotate-180 transition-transform">expand_more</span>
</div>
</summary>
<div class="mt-md pt-md border-t border-outline-variant space-y-4">
<div class="flex justify-between text-body-md font-body-md text-on-surface-variant">
<span>Classic Straight Leg - Indigo x1</span>
<span>$120.00</span>
</div>
<div class="flex justify-between text-body-md font-body-md text-on-surface-variant">
<span>Vintage Wash Skinny - Light Blue x2</span>
<span>$225.00</span>
</div>
</div>
</details>
<!-- Delivery Address -->
<div class="border border-outline-variant p-md rounded-lg flex justify-between items-start">
<div>
<h3 class="text-headline-md font-headline-md mb-2">Delivery Address</h3>
<p class="text-body-md font-body-md text-on-surface-variant">
                        Jane Doe<br/>
                        123 Fashion Ave, Apt 4B<br/>
                        New York, NY 10001
                    </p>
</div>
<button class="text-label-sm font-label-sm uppercase underline text-primary hover:opacity-70">Edit</button>
</div>
<!-- Payment Methods -->
<div>
<h3 class="text-headline-md font-headline-md mb-md">Payment Method</h3>
<div class="space-y-4">
<label class="flex items-center justify-between p-md border border-primary rounded-lg cursor-pointer">
<div class="flex items-center gap-4">
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline" name="payment" type="radio"/>
<span class="font-body-md text-body-md">Credit / Debit Card</span>
</div>
<span class="material-symbols-outlined">credit_card</span>
</label>
<label class="flex items-center justify-between p-md border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-4">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="payment" type="radio"/>
<span class="font-body-md text-body-md">UPI (GPay, PhonePe)</span>
</div>
<span class="material-symbols-outlined">qr_code_scanner</span>
</label>
<label class="flex items-center justify-between p-md border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-4">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="payment" type="radio"/>
<span class="font-body-md text-body-md">Net Banking</span>
</div>
<span class="material-symbols-outlined">account_balance</span>
</label>
<label class="flex items-center justify-between p-md border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-4">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="payment" type="radio"/>
<span class="font-body-md text-body-md">Cash on Delivery</span>
</div>
<span class="material-symbols-outlined">local_shipping</span>
</label>
</div>
</div>
<!-- Totals -->
<div class="pt-lg border-t border-primary">
<div class="flex justify-between items-center text-body-lg font-body-lg mb-2">
<span>Subtotal</span>
<span>$345.00</span>
</div>
<div class="flex justify-between items-center text-body-md font-body-md text-on-surface-variant mb-4">
<span>Shipping</span>
<span>Free</span>
</div>
<div class="flex justify-between items-center text-headline-md font-headline-md">
<span>Total</span>
<span>$345.00</span>
</div>
</div>
</div>
</main>
<!-- Persistent Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-outline-variant p-md z-40 flex justify-center md:static md:border-none md:p-0 md:mb-xxl md:bg-transparent">
<button class="w-full max-w-2xl bg-primary text-on-primary py-4 rounded-lg font-headline-md text-headline-md uppercase hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
<span class="material-symbols-outlined">lock</span>
            Place Order &amp; Pay
        </button>
</div>
</body></html>
