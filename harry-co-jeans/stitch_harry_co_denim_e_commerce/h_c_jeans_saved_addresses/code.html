<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

                        "surface-bright": "#fdf8f8",
                        "on-tertiary-container": "#868381",
                        "on-surface-variant": "#444748",
                        "on-primary-container": "#858383",
                        "outline": "#747878",
                        "tertiary-fixed-dim": "#cac6c3",

                    "spacing": {
                        "base": "8px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "xxl": "80px",
                        "lg": "24px",
                        "xl": "48px",
                        "xs": "4px",
                        "container-max": "1440px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Montserrat"],
                        "display-xl": ["Montserrat"],

                        "label-sm": ["Inter"]

                    "fontSize": {

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-lowest text-primary dark:text-on-surface font-headline-md text-headline-md uppercase fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-margin-mobile md:px-lg h-16 w-full max-w-container-max mx-auto">
<button class="transition-transform active:scale-95 hover:opacity-70 transition-opacity text-primary dark:text-on-surface flex items-center justify-center p-sm">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-on-surface flex-1 text-center">
            HARRY &amp; CO JEANS
        </div>
<button class="transition-transform active:scale-95 hover:opacity-70 transition-opacity text-primary dark:text-on-surface flex items-center justify-center p-sm">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile md:px-lg pt-24 pb-32">
<div class="max-w-2xl mx-auto flex flex-col gap-lg">
<div class="flex items-center justify-between border-b border-primary pb-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary uppercase">Addresses</h1>
</div>
<div class="flex flex-col gap-md mt-sm">
<!-- Address Card 1 (Default) -->
<div class="border border-primary rounded-lg p-lg bg-surface relative flex flex-col gap-sm transition-all duration-300 hover:bg-surface-container-low group">
<div class="absolute top-md right-md bg-surface-container-highest text-on-surface font-label-sm text-label-sm uppercase px-sm py-xs rounded">
                        Default
                    </div>
<h2 class="font-headline-md text-headline-md text-primary">Jane Doe</h2>
<div class="font-body-md text-body-md text-secondary max-w-[80%]">
<p>123 Fashion Ave</p>
<p>Apt 4B</p>
<p>New York, NY 10001</p>
<p class="mt-xs">United States</p>
</div>
<div class="flex gap-md mt-md pt-md border-t border-outline-variant">
<button class="font-label-sm text-label-sm uppercase tracking-widest text-primary underline-offset-4 hover:underline transition-all">Edit</button>
<button class="font-label-sm text-label-sm uppercase tracking-widest text-outline underline-offset-4 hover:text-error hover:underline transition-all">Remove</button>
</div>
</div>
<!-- Address Card 2 -->
<div class="border border-outline-variant rounded-lg p-lg bg-surface relative flex flex-col gap-sm transition-all duration-300 hover:border-primary hover:bg-surface-container-low">
<h2 class="font-headline-md text-headline-md text-primary">John Doe</h2>
<div class="font-body-md text-body-md text-secondary max-w-[80%]">
<p>456 Style Street</p>
<p>Suite 900</p>
<p>Los Angeles, CA 90015</p>
<p class="mt-xs">United States</p>
</div>
<div class="flex gap-md mt-md pt-md border-t border-outline-variant">
<button class="font-label-sm text-label-sm uppercase tracking-widest text-primary underline-offset-4 hover:underline transition-all">Edit</button>
<button class="font-label-sm text-label-sm uppercase tracking-widest text-outline underline-offset-4 hover:text-error hover:underline transition-all">Remove</button>
</div>
</div>
</div>
<!-- Add New Action -->
<button class="mt-lg w-full bg-primary text-on-primary py-lg rounded-lg font-label-sm text-label-sm uppercase tracking-widest transition-transform active:scale-[0.98] hover:bg-inverse-surface flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">add</span>
                Add New Address
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-surface dark:bg-surface-container-lowest text-primary dark:text-on-surface font-label-sm text-label-sm uppercase font-headline-md text-headline-md fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline flat no shadows fixed bottom-0 left-0 w-full flex justify-around items-center py-sm bg-surface dark:bg-surface-container-lowest pb-6 pt-2">
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-surface-variant hover:text-primary dark:hover:text-on-surface transition-all duration-200 active:scale-90 w-1/4" href="#">
<span class="material-symbols-outlined mb-xs">home</span>
            Home
        </a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-surface-variant hover:text-primary dark:hover:text-on-surface transition-all duration-200 active:scale-90 w-1/4" href="#">
<span class="material-symbols-outlined mb-xs">storefront</span>
            Shop
        </a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-surface-variant hover:text-primary dark:hover:text-on-surface transition-all duration-200 active:scale-90 w-1/4" href="#">
<span class="material-symbols-outlined mb-xs">fiber_new</span>
            New
        </a>
<!-- Active Tab: Account -->
<a class="flex flex-col items-center justify-center text-primary dark:text-on-surface font-bold hover:text-primary dark:hover:text-on-surface transition-all duration-200 active:scale-90 w-1/4" href="#">
<span class="material-symbols-outlined mb-xs" style="font-variation-settings: 'FILL' 1;">person</span>
            Account
        </a>
</nav>
</body></html>
