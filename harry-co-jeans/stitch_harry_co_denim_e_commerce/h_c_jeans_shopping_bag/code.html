<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-[100px] md:pb-0">
<!-- TopAppBar -->
<header class="bg-background text-primary fixed top-0 w-full z-50 border-b border-primary flat no shadows">
<div class="flex justify-between items-center px-margin-mobile md:px-xl h-20 w-full max-w-container-max mx-auto">
<button aria-label="Menu" class="hover:opacity-70 transition-opacity duration-200 Active: scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md tracking-tighter text-primary">SHOPPING BAG</h1>
<button aria-label="Shopping Bag" class="hover:opacity-70 transition-opacity duration-200 Active: scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[104px] px-margin-mobile md:px-xl max-w-container-max mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<!-- Cart Items -->
<section class="lg:col-span-8 space-y-xl">
<!-- Item 1 -->
<article class="flex flex-col sm:flex-row gap-lg border-b border-outline-variant pb-lg">
<div class="w-full sm:w-[150px] shrink-0">
<img class="w-full h-auto object-cover aspect-[3/4]" data-alt="A pair of high-end classic black slim jeans laid flat against a pristine white background. The lighting is bright and even, highlighting the deep black fabric and subtle texture of the denim. The aesthetic is highly minimalist, stark, and modern, fitting a luxury fashion editorial style. The jeans appear crisp and meticulously tailored." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLm_IQOk0wencOVGLzrUPrc9-lc5KZbiNHGjrxDHp-NvXj1M9lMIUXRiLTG8aMzwnwQWZEh5xilHDUHs0g40jIzuoLow-D_yRlR5mCGUMISKErVqq3K1-vFwzfI6cv1fxd4f0qgqpvz64wU8XPS027xZkm7lw66vQc09tootUi4LgC6xCehoOshft5xN5FVtqWf24ZZIuU6XF02nBRoPzJcYAhl-cJ4zDPXMYwxQnczX6hvVc9U2rH"/>
</div>
<div class="flex flex-col flex-grow justify-between">
<div>
<div class="flex justify-between items-start mb-sm">
<h2 class="text-headline-md font-headline-md uppercase tracking-tight">Classic Black Slim Jeans</h2>
<span class="text-body-lg font-body-lg font-semibold">₹3,999</span>
</div>
<p class="text-on-surface-variant text-body-md font-body-md mb-xs">Color: Black</p>
<p class="text-on-surface-variant text-body-md font-body-md mb-md">Size: 32</p>
</div>
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md mt-auto">
<div class="flex items-center border border-primary rounded w-max">
<button class="px-3 py-1 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">remove</span></button>
<span class="px-4 py-1 border-x border-primary font-semibold">1</span>
<button class="px-3 py-1 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
<div class="flex gap-md">
<button class="text-label-sm font-label-sm uppercase hover:underline transition-all border-b border-transparent hover:border-primary text-secondary">Move to Wishlist</button>
<button class="text-label-sm font-label-sm uppercase hover:underline transition-all border-b border-transparent hover:border-primary text-secondary">Remove</button>
</div>
</div>
</div>
</article>
<!-- Item 2 -->
<article class="flex flex-col sm:flex-row gap-lg border-b border-outline-variant pb-lg">
<div class="w-full sm:w-[150px] shrink-0">
<img class="w-full h-auto object-cover aspect-[3/4]" data-alt="A pair of urban blue straight fit jeans presented cleanly on a stark white background. The denim has a slight fade, indicating a premium wash. The lighting is high-key and shadowless, emphasizing the structural cut of the jeans and the contrast between the vibrant blue and the white space. The overall mood is modern, sharp, and retail-focused." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaI4zDfENcuc3om0UrF4voIyusH4guBuvYMz9xUo1ms7DtN9MNeRqwzH41OE-ZCiI0otodIToHFcDnORV4NSUHqcmtlXOG2vkgjJamjHtIHbaaElEjfRLYXwTt78WRoCI51Pu7t3BjGK4ck78k4KtIfYwNj7R8esTZK34eK8J3NBGhSN4Gy4BdpR-k7sMEv9hHS3EzqSOKuwT3_v2AVR5XDtEEYx35mX50xw_iFpjOXXF3ZtcyBTi4"/>
</div>
<div class="flex flex-col flex-grow justify-between">
<div>
<div class="flex justify-between items-start mb-sm">
<h2 class="text-headline-md font-headline-md uppercase tracking-tight">Urban Blue Straight Jeans</h2>
<span class="text-body-lg font-body-lg font-semibold">₹4,499</span>
</div>
<p class="text-on-surface-variant text-body-md font-body-md mb-xs">Color: Vintage Blue</p>
<p class="text-on-surface-variant text-body-md font-body-md mb-md">Size: 32</p>
</div>
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md mt-auto">
<div class="flex items-center border border-primary rounded w-max">
<button class="px-3 py-1 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">remove</span></button>
<span class="px-4 py-1 border-x border-primary font-semibold">1</span>
<button class="px-3 py-1 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
<div class="flex gap-md">
<button class="text-label-sm font-label-sm uppercase hover:underline transition-all border-b border-transparent hover:border-primary text-secondary">Move to Wishlist</button>
<button class="text-label-sm font-label-sm uppercase hover:underline transition-all border-b border-transparent hover:border-primary text-secondary">Remove</button>
</div>
</div>
</div>
</article>
</section>
<!-- Order Summary & Checkout -->
<aside class="lg:col-span-4 mt-xxl lg:mt-0">
<div class="bg-surface-container-lowest border border-primary rounded p-lg sticky top-[104px]">
<!-- Coupon -->
<div class="mb-lg pb-lg border-b border-outline-variant">
<label class="block text-label-sm font-label-sm uppercase mb-md" for="coupon">Apply Coupon</label>
<div class="flex gap-sm">
<input class="flex-grow border border-primary rounded px-md py-sm text-body-md font-body-md focus:ring-1 focus:ring-primary focus:border-primary bg-transparent outline-none" id="coupon" placeholder="Enter code" type="text"/>
<button class="bg-primary text-on-primary px-lg py-sm rounded text-label-sm font-label-sm uppercase hover:opacity-90 transition-opacity">Apply</button>
</div>
</div>
<!-- Summary Details -->
<h3 class="text-headline-md font-headline-md tracking-tight uppercase mb-md">Order Summary</h3>
<div class="space-y-sm text-body-md font-body-md mb-lg pb-lg border-b border-outline-variant">
<div class="flex justify-between">
<span class="text-on-surface-variant">Subtotal</span>
<span>₹8,498</span>
</div>
<div class="flex justify-between text-secondary">
<span>Discount (WELCOME500)</span>
<span>-₹500</span>
</div>
<div class="flex justify-between">
<span class="text-on-surface-variant">Shipping</span>
<span>Free</span>
</div>
</div>
<!-- Total -->
<div class="flex justify-between items-center mb-md">
<span class="text-headline-md font-headline-md tracking-tight uppercase">Total</span>
<span class="text-headline-md font-headline-md tracking-tight">₹7,998</span>
</div>
<div class="bg-surface-container px-md py-sm rounded mb-lg flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">sell</span>
<span class="text-label-sm font-label-sm uppercase tracking-wider">You saved ₹500</span>
</div>
<!-- Desktop Checkout Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded text-label-sm font-label-sm uppercase tracking-widest hover:opacity-90 transition-opacity hidden md:block">
                    Proceed to Checkout
                </button>
</div>
</aside>
</main>
<!-- Mobile Persistent Checkout Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-primary p-margin-mobile md:hidden z-50">
<div class="flex justify-between items-center mb-sm">
<span class="text-headline-md font-headline-md tracking-tight">₹7,998</span>
<button class="text-label-sm font-label-sm uppercase underline text-secondary">View Details</button>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded text-label-sm font-label-sm uppercase tracking-widest hover:opacity-90 transition-opacity">
            Proceed to Checkout
        </button>
</div>
</body></html>
