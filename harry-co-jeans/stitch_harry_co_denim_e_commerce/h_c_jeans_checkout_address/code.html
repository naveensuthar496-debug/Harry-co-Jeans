<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-background text-primary fixed top-0 w-full z-50 border-b border-outline-variant flex justify-between items-center px-margin-mobile md:px-xl h-20 max-w-container-max mx-auto">
<button aria-label="Go back" class="text-secondary hover:opacity-70 transition-opacity duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-headline-md font-headline-md tracking-tighter text-primary">
            HARRY &amp; CO JEANS
        </div>
<div class="w-6"></div> <!-- Spacer to center title -->
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-xl max-w-3xl mx-auto w-full">
<!-- Stepper -->
<div class="mb-xl flex items-center justify-between text-label-sm font-label-sm uppercase tracking-widest text-on-surface-variant relative">
<div class="absolute top-1/2 left-0 w-full h-px bg-outline-variant -z-10 transform -translate-y-1/2 hidden sm:block"></div>
<div class="flex flex-col items-center bg-background px-2 sm:px-4 text-primary">
<span class="material-symbols-outlined mb-1 text-primary text-[18px]">check_circle</span>
<span class="hidden sm:inline">LOGIN</span>
</div>
<div class="flex flex-col items-center bg-background px-2 sm:px-4 text-primary font-bold">
<span class="material-symbols-outlined mb-1 fill-icon text-[18px]">radio_button_checked</span>
<span>ADDRESS</span>
</div>
<div class="flex flex-col items-center bg-background px-2 sm:px-4">
<span class="material-symbols-outlined mb-1 text-[18px]">radio_button_unchecked</span>
<span class="hidden sm:inline">SUMMARY</span>
</div>
<div class="flex flex-col items-center bg-background px-2 sm:px-4">
<span class="material-symbols-outlined mb-1 text-[18px]">radio_button_unchecked</span>
<span class="hidden sm:inline">PAYMENT</span>
</div>
</div>
<!-- Page Header -->
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg mb-lg">Delivery Address</h1>
<!-- Saved Addresses Container -->
<div class="space-y-md mb-xl">
<!-- Address Card 1 (Selected) -->
<label class="relative block border-2 border-primary rounded-lg p-lg cursor-pointer bg-surface-container-lowest">
<input checked="" class="peer sr-only" name="address_selection" type="radio" value="address1"/>
<div class="flex items-start justify-between">
<div>
<div class="flex items-center gap-2 mb-2">
<span class="font-headline-md text-headline-md text-primary">Jane Doe</span>
<span class="bg-surface-dim text-on-surface-variant text-label-sm font-label-sm px-2 py-1 rounded">DEFAULT</span>
</div>
<p class="text-body-md text-on-surface-variant mb-1">123 Fashion Ave, Apt 4B</p>
<p class="text-body-md text-on-surface-variant mb-1">New York, NY 10001</p>
<p class="text-body-md text-on-surface-variant mt-2">Mobile: (555) 123-4567</p>
</div>
<div class="peer-checked:block hidden text-primary">
<span class="material-symbols-outlined fill-icon">check_circle</span>
</div>
</div>
<div class="mt-md pt-md border-t border-outline-variant flex gap-md">
<button class="text-label-sm font-label-sm uppercase tracking-widest text-secondary hover:text-primary transition-colors" type="button">Edit</button>
<button class="text-label-sm font-label-sm uppercase tracking-widest text-secondary hover:text-primary transition-colors" type="button">Remove</button>
</div>
</label>
<!-- Address Card 2 -->
<label class="relative block border border-outline-variant rounded-lg p-lg cursor-pointer hover:border-primary transition-colors bg-surface-container-lowest">
<input class="peer sr-only" name="address_selection" type="radio" value="address2"/>
<div class="flex items-start justify-between">
<div>
<div class="flex items-center gap-2 mb-2">
<span class="font-headline-md text-headline-md text-primary">John Doe</span>
</div>
<p class="text-body-md text-on-surface-variant mb-1">456 Style Street, Suite 900</p>
<p class="text-body-md text-on-surface-variant mb-1">Los Angeles, CA 90015</p>
<p class="text-body-md text-on-surface-variant mt-2">Mobile: (555) 987-6543</p>
</div>
<div class="peer-checked:block hidden text-primary">
<span class="material-symbols-outlined fill-icon">check_circle</span>
</div>
</div>
</label>
</div>
<!-- Add New Address Button (Trigger for form) -->
<div class="mb-xl">
<button class="w-full py-4 border-2 border-primary border-dashed rounded-lg text-primary flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">add</span>
<span class="font-headline-md text-[16px] tracking-wide">ADD NEW ADDRESS</span>
</button>
</div>
<!-- New Address Form (Initially hidden, shown for demonstration based on prompt) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg mb-xl">
<h2 class="text-headline-md font-headline-md mb-md">New Delivery Address</h2>
<form class="space-y-lg">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="fullname">Full Name</label>
<input class="border border-primary rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg" id="fullname" placeholder="Jane Doe" type="text"/>
</div>
<div class="flex flex-col">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="phone">Phone Number</label>
<input class="border border-outline-variant rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="address1">Address (House No, Building, Street)</label>
<input class="border border-outline-variant rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg" id="address1" placeholder="123 Fashion Ave" type="text"/>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-lg">
<div class="flex flex-col col-span-2 md:col-span-1">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="city">City</label>
<input class="border border-outline-variant rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg" id="city" placeholder="New York" type="text"/>
</div>
<div class="flex flex-col">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="state">State</label>
<select class="border border-outline-variant rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg appearance-none" id="state">
<option value="">Select State</option>
<option value="NY">New York</option>
<option value="CA">California</option>
</select>
</div>
<div class="flex flex-col">
<label class="text-label-sm font-label-sm uppercase text-secondary mb-2" for="zip">PIN / Zip Code</label>
<input class="border border-outline-variant rounded bg-transparent p-4 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-body-lg font-body-lg" id="zip" placeholder="10001" type="text"/>
</div>
</div>
<div class="flex items-center gap-3 pt-md">
<input class="w-5 h-5 border-2 border-primary rounded text-primary focus:ring-primary cursor-pointer" id="save_default" type="checkbox"/>
<label class="text-body-md font-body-md text-on-surface cursor-pointer" for="save_default">Save as default delivery address</label>
</div>
<div class="flex gap-md pt-md">
<button class="px-6 py-3 border border-primary rounded text-primary text-label-sm font-label-sm uppercase tracking-widest hover:bg-surface-container-low transition-colors" type="button">Cancel</button>
<button class="px-6 py-3 bg-primary text-on-primary rounded text-label-sm font-label-sm uppercase tracking-widest hover:bg-tertiary-container transition-colors" type="button">Save Address</button>
</div>
</form>
</div>
</main>
<!-- Persistent Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-margin-mobile md:p-lg z-40 flex justify-center pb-safe">
<div class="max-w-3xl w-full flex flex-col md:flex-row items-center justify-between gap-md">
<div class="hidden md:block">
<p class="text-body-md font-body-md text-on-surface-variant">Delivering to:</p>
<p class="text-body-lg font-body-lg font-bold text-primary">Jane Doe, 10001</p>
</div>
<button class="w-full md:w-auto bg-primary text-on-primary rounded-lg py-4 px-xl font-headline-md text-[16px] tracking-widest uppercase hover:bg-tertiary-container transition-colors shadow-lg shadow-black/5 flex items-center justify-center gap-2">
                CONTINUE TO SUMMARY
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
