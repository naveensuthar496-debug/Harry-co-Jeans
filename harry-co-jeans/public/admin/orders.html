<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Orders Management — HARRY &amp; CO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-surface-container-lowest text-on-background font-body-md antialiased flex h-screen overflow-hidden">

  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="h-16 border-b border-outline-variant bg-background px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <button class="md:hidden text-primary p-2 hover:bg-surface-container rounded-lg">
          <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <h1 class="text-base font-bold text-primary uppercase tracking-tight">SALES &middot; ORDER FULFILLMENT</h1>
      </div>
      <a href="/admin/dashboard" class="text-xs font-bold uppercase tracking-wider text-primary underline">&larr; Dashboard</a>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-2xl font-headline-lg font-bold text-primary">CUSTOMER ORDERS</h2>
          <p class="text-xs text-secondary">Manage customer orders, inspect receipts, and update shipping progress.</p>
        </div>

        <select id="order-status-filter" class="bg-white border border-outline-variant rounded-lg px-3 py-2 text-xs font-bold text-primary focus:outline-none focus:border-primary cursor-pointer">
          <option value="all">Status: All Orders</option>
          <option value="placed">Placed</option>
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="bg-white border border-outline-variant rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-surface-container font-bold text-primary uppercase border-b border-outline-variant">
              <tr>
                <th class="p-4">Order #</th>
                <th class="p-4">Customer &amp; Phone</th>
                <th class="p-4">Purchased Items</th>
                <th class="p-4">Total Paid</th>
                <th class="p-4">Payment</th>
                <th class="p-4">Status &amp; Action</th>
              </tr>
            </thead>
            <tbody id="orders-tbody" class="divide-y divide-outline-variant/40">
              <tr><td colspan="6" class="p-8 text-center text-secondary">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, qsFromParams } from '/assets/js/core/api.js';
    import { money } from '/assets/js/core/format.js';
    import { toast } from '/assets/js/core/ui.js';
    import { initAdminChrome } from '/assets/js/components/admin-nav.js';

    const user = await initAdminChrome('orders');
    if (user) loadOrders();

    const tbody = document.getElementById('orders-tbody');
    const statusFilter = document.getElementById('order-status-filter');

    statusFilter.addEventListener('change', loadOrders);

    async function loadOrders() {
      tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-secondary">Loading orders...</td></tr>';
      try {
        const queryObj = {
          status: statusFilter.value !== 'all' ? statusFilter.value : undefined,
        };
        const res = await api.get('/admin/orders' + qsFromParams(queryObj));
        const orders = res.orders || [];

        if (!orders.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-12 text-center text-secondary font-semibold">No orders matching criteria.</td></tr>';
          return;
        }

        tbody.innerHTML = orders.map(o => `
          <tr class="hover:bg-surface-container-low transition">
            <td class="p-4">
              <a href="/order-confirmed?order=${encodeURIComponent(o.orderNumber)}" target="_blank" class="font-mono font-bold text-primary underline">${o.orderNumber}</a>
              <div class="text-[10px] text-secondary mt-0.5">${new Date(o.placedAt).toLocaleDateString()}</div>
            </td>
            <td class="p-4">
              <div class="font-bold text-primary">${o.customerName}</div>
              <div class="text-[11px] text-secondary">${o.shippingAddress?.phone || o.customerEmail || ''}</div>
              <div class="text-[10px] text-secondary">${o.shippingAddress?.city || ''}, ${o.shippingAddress?.state || ''}</div>
            </td>
            <td class="p-4">
              <div class="space-y-1">
                ${(o.items || []).map(it => `
                  <div class="text-xs text-primary font-medium">
                    ${it.quantity}&times; ${it.name} <span class="text-secondary font-normal">(${it.size})</span>
                  </div>
                `).join('')}
              </div>
            </td>
            <td class="p-4 font-bold text-sm text-primary">${money(o.total)}</td>
            <td class="p-4">
              <span class="font-semibold uppercase text-[10px] block">${o.paymentMethod}</span>
              <span class="text-[10px] text-emerald-700 font-bold">${o.paymentStatus}</span>
            </td>
            <td class="p-4">
              <select class="status-select bg-surface-container border border-outline-variant rounded p-1.5 font-bold text-xs" data-id="${o.id}">
                <option value="placed" ${o.status === 'placed' ? 'selected' : ''}>Placed</option>
                <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('.status-select').forEach(sel => {
          sel.addEventListener('change', async (e) => {
            const ordId = sel.dataset.id;
            const newStatus = e.target.value;
            try {
              await api.patch(`/admin/orders/${ordId}/status`, { status: newStatus });
              toast(`Order status updated to ${newStatus}`, 'success');
            } catch (err) {
              toast(err.message || 'Failed to update order status', 'error');
            }
          });
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-error font-bold">${err.message || 'Failed to load orders.'}</td></tr>`;
      }
    }
  </script>
</body>
</html>
