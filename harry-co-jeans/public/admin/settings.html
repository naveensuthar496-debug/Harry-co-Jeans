<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Settings — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-surface-container-lowest text-on-background font-body-md antialiased flex h-screen overflow-hidden">

  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="h-16 border-b border-outline-variant bg-background px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <button class="md:hidden text-primary p-2 hover:bg-surface-container rounded-lg">
          <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <h1 class="text-base font-bold text-primary uppercase tracking-tight">SETTINGS &middot; STORE CONFIGURATION</h1>
      </div>
      <a href="/admin/dashboard" class="text-xs font-bold uppercase tracking-wider text-primary underline">&larr; Dashboard</a>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 max-w-3xl">
      <div>
        <h2 class="text-2xl font-headline-lg font-bold text-primary">STORE PREFERENCES</h2>
        <p class="text-xs text-secondary">Configure store branding, support channels, and address details.</p>
      </div>

      <form id="settings-form" class="bg-white border border-outline-variant rounded-2xl p-6 shadow-sm space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Store Name</label>
          <input type="text" name="storeName" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm font-bold focus:outline-none focus:border-primary"/>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">Support Email</label>
            <input type="email" name="supportEmail" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">Contact Phone</label>
            <input type="text" name="contactPhone" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Physical Atelier Address</label>
          <input type="text" name="address" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Base Currency</label>
          <input type="text" name="baseCurrency" value="INR" readonly class="w-full bg-surface-container-high border border-outline-variant rounded-lg p-3 text-sm font-bold text-secondary"/>
        </div>

        <div class="pt-4 border-t border-outline-variant">
          <button type="submit" class="bg-primary text-on-primary text-xs font-bold uppercase tracking-wider px-8 py-3.5 rounded-lg hover:bg-black/80 transition">
            Save Preferences
          </button>
        </div>
      </form>
    </main>
  </div>

  <script type="module">
    import { api } from '/assets/js/core/api.js';
    import { toast } from '/assets/js/core/ui.js';
    import { initAdminChrome } from '/assets/js/components/admin-nav.js';

    const user = await initAdminChrome('settings');
    if (user) loadSettings();

    const form = document.getElementById('settings-form');

    async function loadSettings() {
      try {
        const res = await api.get('/admin/settings');
        const s = res.settings || {};
        form.elements.storeName.value = s.store_name || 'HARRY & CO JEANS';
        form.elements.supportEmail.value = s.support_email || 'care@hcjeans.com';
        form.elements.contactPhone.value = s.contact_phone || '+91 8000 123 456';
        form.elements.address.value = s.address || 'Studio 4, Indiranagar, Bengaluru, KA 560038, India';
      } catch (err) {
        toast(err.message || 'Failed to load settings', 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api.patch('/admin/settings', {
          storeName: form.elements.storeName.value.trim(),
          supportEmail: form.elements.supportEmail.value.trim(),
          contactPhone: form.elements.contactPhone.value.trim(),
          address: form.elements.address.value.trim(),
        });
        toast('Store preferences saved', 'success');
      } catch (err) {
        toast(err.message || 'Failed to save settings', 'error');
      }
    });
  </script>
</body>
</html>
