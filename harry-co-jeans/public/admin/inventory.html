<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Inventory Matrix — HARRY &amp; CO Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-surface-container-lowest text-on-background font-body-md antialiased flex h-screen overflow-hidden">

  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="h-16 border-b border-outline-variant bg-background px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <button class="md:hidden text-primary p-2 hover:bg-surface-container rounded-lg">
          <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <h1 class="text-base font-bold text-primary uppercase tracking-tight">INVENTORY &middot; SKU STOCK MATRIX</h1>
      </div>
      <a href="/admin/products" class="text-xs font-bold uppercase tracking-wider text-primary underline">&larr; Back to Products</a>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-headline-lg font-bold text-primary">STOCK LEVELS</h2>
          <p class="text-xs text-secondary">Real-time stock across sizes. Click any stock cell to adjust.</p>
        </div>
      </div>

      <div class="bg-white border border-outline-variant rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-surface-container font-bold text-primary uppercase border-b border-outline-variant">
              <tr>
                <th class="p-4 w-12"></th>
                <th class="p-4">SKU</th>
                <th class="p-4">Product Name</th>
                <th class="p-4">Size</th>
                <th class="p-4">Color</th>
                <th class="p-4">Price</th>
                <th class="p-4">Current Stock</th>
                <th class="p-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="inventory-tbody" class="divide-y divide-outline-variant/40">
              <tr><td colspan="8" class="p-8 text-center text-secondary">Loading inventory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '/assets/js/core/api.js';
    import { money } from '/assets/js/core/format.js';
    import { toast } from '/assets/js/core/ui.js';
    import { initAdminChrome } from '/assets/js/components/admin-nav.js';

    const user = await initAdminChrome('inventory');
    if (user) loadInventory();

    const tbody = document.getElementById('inventory-tbody');

    async function loadInventory() {
      try {
        const res = await api.get('/admin/inventory');
        const list = res.inventory || [];

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-secondary">No variants found in database.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(v => `
          <tr class="hover:bg-surface-container-low transition">
            <td class="p-4">
              <img src="${v.imageUrl || ''}" class="w-8 h-10 object-cover bg-surface-container rounded"/>
            </td>
            <td class="p-4 font-mono font-bold text-primary">${v.sku}</td>
            <td class="p-4 font-semibold text-primary">${v.productName}</td>
            <td class="p-4 font-bold text-primary">${v.size}</td>
            <td class="p-4 text-secondary">${v.color}</td>
            <td class="p-4 font-bold">${money(v.price)}</td>
            <td class="p-4">
              <input type="number" class="stock-input w-20 bg-surface-container-low border border-outline-variant rounded px-2 py-1 font-bold text-xs ${v.stock <= 5 ? 'text-error' : 'text-primary'}" value="${v.stock}" data-id="${v.variantId}"/>
            </td>
            <td class="p-4 text-right">
              <button class="btn-save-stock bg-primary text-on-primary px-3 py-1 rounded text-xs font-bold uppercase hover:bg-black/80" data-id="${v.variantId}">
                Update
              </button>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('.btn-save-stock').forEach(b => {
          b.addEventListener('click', async () => {
            const vId = b.dataset.id;
            const input = document.querySelector(`.stock-input[data-id="${vId}"]`);
            const stock = parseInt(input.value, 10);
            try {
              await api.patch(`/admin/inventory/${vId}`, { stock });
              toast('Stock updated', 'success');
            } catch (err) {
              toast(err.message || 'Failed to update stock', 'error');
            }
          });
        });
      } catch (err) {
        tbody.innerHTML = `<tr class="text-error"><td colspan="8" class="p-8 text-center">${err.message || 'Failed to load inventory'}</td></tr>`;
      }
    }
  </script>
</body>
</html>
