<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Portal Login — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-surface-container-low text-on-background font-body-md antialiased flex flex-col min-h-screen">

  <header class="p-6">
    <a href="/" class="text-xl font-bold uppercase tracking-tighter text-primary">HARRY &amp; CO</a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-outline-variant rounded-2xl p-8 shadow-md space-y-6">
      <div class="text-center">
        <div class="w-12 h-12 bg-primary text-on-primary rounded-xl flex items-center justify-center mx-auto mb-3 shadow">
          <span class="material-symbols-outlined text-[26px]">admin_panel_settings</span>
        </div>
        <span class="text-xs uppercase tracking-widest font-bold text-secondary">STAFF ONLY</span>
        <h1 class="text-2xl font-headline-lg font-bold text-primary mt-1">ADMIN CONSOLE</h1>
        <p class="text-xs text-secondary mt-1">Sign in with administrator credentials to manage products and orders.</p>
      </div>

      <!-- Quick Demo Fill -->
      <button id="btn-fill-admin" type="button" class="w-full bg-surface-container hover:bg-surface-container-high border border-outline-variant rounded-xl p-3 text-xs font-bold text-primary flex items-center justify-center gap-2 transition">
        <span class="material-symbols-outlined text-[18px]">key</span>
        Fill Demo Admin (<code class="font-mono">admin@hcjeans.com</code>)
      </button>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Staff Email</label>
          <input type="email" name="email" required placeholder="admin@hcjeans.com" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Password</label>
          <input type="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <button type="submit" class="w-full bg-primary text-on-primary text-xs font-bold uppercase tracking-wider py-3.5 rounded-lg hover:bg-black/80 transition shadow-lg flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[18px]">lock_open</span>
          ENTER ADMIN CONSOLE
        </button>
      </form>

      <div class="text-center border-t border-outline-variant/60 pt-4 text-xs text-secondary">
        <p><a href="/" class="hover:underline">&larr; Return to Storefront</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { login } from '/assets/js/core/auth.js';
    import { toast, params, busy } from '/assets/js/core/ui.js';

    const { next } = params();
    const form = document.getElementById('admin-login-form');

    document.getElementById('btn-fill-admin').addEventListener('click', () => {
      form.elements.email.value = 'admin@hcjeans.com';
      form.elements.password.value = 'admin123';
      toast('Admin demo credentials populated', 'info');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const restore = busy(submitBtn, 'Authenticating...');

      try {
        const user = await login(form.elements.email.value.trim(), form.elements.password.value);
        if (user.role !== 'admin' && user.role !== 'manager') {
          throw new Error('Access denied. Staff permissions required.');
        }
        toast('Welcome to the Admin Console', 'success');
        location.href = next || '/admin/dashboard';
      } catch (err) {
        toast(err.message || 'Login failed', 'error');
        restore();
      }
    });
  </script>
</body>
</html>
