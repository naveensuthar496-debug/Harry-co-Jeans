<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Saved Addresses — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased pt-20 pb-20 md:pb-12">

  <!-- Header -->
  <header class="bg-background/95 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant">
    <div class="flex justify-between items-center px-4 md:px-8 h-20 w-full max-w-7xl mx-auto">
      <a href="/" class="text-headline-md font-headline-md font-bold tracking-tighter text-primary uppercase">
        HARRY &amp; CO
      </a>
      <a href="/account" class="text-xs font-bold text-secondary hover:text-primary">&larr; Account Dashboard</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-8">
    <div class="flex justify-between items-end mb-8 border-b border-outline-variant pb-4">
      <div>
        <p class="text-xs uppercase tracking-widest font-bold text-secondary mb-1">SAVED DESTINATIONS</p>
        <h1 class="text-2xl sm:text-3xl font-headline-lg font-bold text-primary">ADDRESS BOOK</h1>
      </div>
      <button id="btn-toggle-add" class="bg-primary text-on-primary text-xs font-bold uppercase tracking-wider px-4 py-2 rounded-lg hover:bg-black/80 transition">
        + Add New Address
      </button>
    </div>

    <!-- New Address Form (Hidden by default) -->
    <div id="add-form-wrap" class="hidden bg-white border border-outline-variant rounded-2xl p-6 shadow-sm mb-8">
      <h2 class="text-sm font-bold uppercase tracking-wider text-primary border-b border-outline-variant/60 pb-3 mb-4">ADD NEW SHIPPING ADDRESS</h2>
      <form id="new-address-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">Full Name *</label>
            <input type="text" name="fullName" required placeholder="Arjun Verma" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">Phone Number *</label>
            <input type="tel" name="phone" required placeholder="+91 98765 43210" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Address Line 1 *</label>
          <input type="text" name="line1" required placeholder="Flat / House No, Building, Street" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Address Line 2</label>
          <input type="text" name="line2" placeholder="Landmark, Area" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">City *</label>
            <input type="text" name="city" required placeholder="Bengaluru" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-secondary mb-1">State *</label>
            <input type="text" name="state" required placeholder="Karnataka" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label class="block text-xs font-bold uppercase text-secondary mb-1">Pincode *</label>
            <input type="text" name="zip" required placeholder="560038" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="bg-primary text-on-primary text-xs font-bold uppercase px-6 py-2.5 rounded-lg">Save Address</button>
          <button type="button" id="btn-cancel-add" class="bg-surface-container text-primary text-xs font-bold uppercase px-4 py-2.5 rounded-lg">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Address Cards Grid -->
    <div id="addresses-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-16">
      <div class="py-12 text-center text-secondary col-span-full">Loading addresses...</div>
    </div>
  </main>

  <script type="module">
    import { api } from '/assets/js/core/api.js';
    import { toast } from '/assets/js/core/ui.js';
    import { requireCustomer } from '/assets/js/core/auth.js';
    import { initChrome } from '/assets/js/components/chrome.js';

    await initChrome();
    const user = await requireCustomer();
    if (user) loadAddresses();

    const formWrap = document.getElementById('add-form-wrap');
    const form = document.getElementById('new-address-form');
    document.getElementById('btn-toggle-add').addEventListener('click', () => formWrap.classList.toggle('hidden'));
    document.getElementById('btn-cancel-add').addEventListener('click', () => formWrap.classList.add('hidden'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api.post('/addresses', {
          fullName: form.elements.fullName.value.trim(),
          phone: form.elements.phone.value.trim(),
          line1: form.elements.line1.value.trim(),
          line2: form.elements.line2.value.trim(),
          city: form.elements.city.value.trim(),
          state: form.elements.state.value.trim(),
          zip: form.elements.zip.value.trim(),
        });
        toast('Address saved successfully', 'success');
        form.reset();
        formWrap.classList.add('hidden');
        loadAddresses();
      } catch (err) {
        toast(err.message || 'Failed to save address', 'error');
      }
    });

    async function loadAddresses() {
      const grid = document.getElementById('addresses-grid');
      try {
        const res = await api.get('/addresses');
        const addresses = res.addresses || [];

        if (!addresses.length) {
          grid.innerHTML = '<p class="col-span-full text-center text-secondary py-12">No saved addresses yet.</p>';
          return;
        }

        grid.innerHTML = addresses.map(a => `
          <div class="bg-white border border-outline-variant/80 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="font-bold text-sm text-primary">${a.fullName}</span>
                ${a.isDefault ? '<span class="text-[9px] bg-black text-white px-2 py-0.5 rounded font-bold uppercase">Default</span>' : ''}
              </div>
              <p class="text-xs text-secondary leading-relaxed">${a.line1} ${a.line2 || ''}</p>
              <p class="text-xs text-secondary">${a.city}, ${a.state} - ${a.zip}</p>
              <p class="text-xs text-secondary mt-1">Phone: ${a.phone}</p>
            </div>

            <div class="pt-4 border-t border-outline-variant/40 flex justify-end">
              <button class="btn-del-addr text-xs font-bold text-error hover:underline" data-id="${a.id}">Delete</button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.btn-del-addr').forEach(b => {
          b.addEventListener('click', async () => {
            if (confirm('Delete this address?')) {
              await api.del(`/addresses/${b.dataset.id}`);
              toast('Address deleted', 'info');
              loadAddresses();
            }
          });
        });
      } catch (err) {
        grid.innerHTML = '<p class="col-span-full text-center text-error">Failed to load addresses.</p>';
      }
    }
  </script>
</body>
</html>
