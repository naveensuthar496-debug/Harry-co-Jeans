<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Create Account — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased flex flex-col min-h-screen">

  <header class="p-6">
    <a href="/" class="text-xl font-bold uppercase tracking-tighter text-primary">HARRY &amp; CO</a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-outline-variant rounded-2xl p-8 shadow-sm space-y-6">
      <div class="text-center">
        <span class="text-xs uppercase tracking-widest font-bold text-secondary">BECOME A MEMBER</span>
        <h1 class="text-2xl font-headline-lg font-bold text-primary mt-1">JOIN HARRY &amp; CO</h1>
        <p class="text-xs text-secondary mt-1">Join the Selvedge Guild to earn points on every order.</p>
      </div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Full Name *</label>
          <input type="text" name="fullName" required placeholder="e.g. Arjun Verma" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Email Address *</label>
          <input type="email" name="email" required placeholder="you@domain.com" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Phone Number</label>
          <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Password (min 6 characters) *</label>
          <input type="password" name="password" minlength="6" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <button type="submit" class="w-full bg-primary text-on-primary text-xs font-bold uppercase tracking-wider py-3.5 rounded-lg hover:bg-black/80 transition shadow-lg">
          CREATE ACCOUNT
        </button>
      </form>

      <div class="text-center border-t border-outline-variant/60 pt-4 text-xs text-secondary">
        <p>Already have an account? <a href="/login" class="font-bold text-primary underline">Sign In</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { register } from '/assets/js/core/auth.js';
    import { toast, params, busy } from '/assets/js/core/ui.js';

    const { next } = params();
    const form = document.getElementById('register-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      const restore = busy(submitBtn, 'Creating account...');

      try {
        await register({
          fullName: form.elements.fullName.value.trim(),
          email: form.elements.email.value.trim(),
          phone: form.elements.phone.value.trim(),
          password: form.elements.password.value,
        });
        toast('Account created successfully!', 'success');
        location.href = next || '/account';
      } catch (err) {
        toast(err.message || 'Registration failed', 'error');
        restore();
      }
    });
  </script>
</body>
</html>
