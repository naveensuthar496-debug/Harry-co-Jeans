<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Shop All Products — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden pt-20 pb-20 md:pb-12">

  <!-- Header -->
  <header class="bg-background/95 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant">
    <div class="flex justify-between items-center px-4 md:px-8 h-20 w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-4">
        <button aria-label="Menu" class="text-primary hover:opacity-70 p-2 rounded-lg hover:bg-surface-container transition">
          <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <nav class="hidden md:flex items-center gap-6 ml-4">
          <a href="/shop" class="text-label-sm font-bold tracking-wider uppercase text-primary border-b-2 border-primary pb-1">Shop All</a>
          <a href="/selvedge" class="text-label-sm font-semibold tracking-wider uppercase hover:text-secondary transition-colors">The Selvedge Series</a>
          <a href="/help" class="text-label-sm font-semibold tracking-wider uppercase hover:text-secondary transition-colors">Denim Care</a>
        </nav>
      </div>

      <a href="/" class="text-headline-md font-headline-md font-bold tracking-tighter text-primary uppercase text-center">
        HARRY &amp; CO
      </a>

      <div class="flex items-center gap-2">
        <a href="/account" class="text-primary hover:opacity-70 p-2 rounded-lg hover:bg-surface-container transition" aria-label="Account">
          <span class="material-symbols-outlined text-[22px]">person</span>
        </a>
        <button aria-label="Cart" class="text-primary hover:opacity-70 p-2 rounded-lg hover:bg-surface-container relative transition">
          <span class="material-symbols-outlined text-[22px]">shopping_bag</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Shop Main -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 pt-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end pb-6 border-b border-outline-variant gap-4">
      <div>
        <p class="text-xs uppercase tracking-widest font-bold text-secondary mb-1">ATELIER CATALOG</p>
        <h1 class="text-3xl sm:text-4xl font-headline-lg font-bold text-primary">ALL PRODUCTS</h1>
      </div>

      <!-- Search & Sort Controls -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <div class="relative flex-1 md:w-64">
          <span class="material-symbols-outlined absolute left-3 top-2.5 text-secondary text-[20px]">search</span>
          <input id="search-input" type="text" placeholder="Search by name, fit, wash..." class="w-full bg-surface-container border border-outline-variant rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-primary"/>
        </div>

        <select id="sort-select" class="bg-surface-container border border-outline-variant rounded-lg px-3 py-2 text-sm font-semibold text-primary focus:outline-none focus:border-primary cursor-pointer">
          <option value="recommended">Sort: Recommended</option>
          <option value="newest">Sort: Newest</option>
          <option value="price-low">Sort: Price (Low to High)</option>
          <option value="price-high">Sort: Price (High to Low)</option>
          <option value="rating">Sort: Top Rated</option>
        </select>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="flex overflow-x-auto gap-2 py-4 border-b border-outline-variant/60 no-scrollbar">
      <button class="filter-chip active px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-primary text-on-primary" data-fit="all">All Fits</button>
      <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high" data-fit="straight">Straight</button>
      <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high" data-fit="slim">Slim</button>
      <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high" data-fit="relaxed">Relaxed</button>
      <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high" data-fit="baggy">Baggy</button>
      <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high" data-type="Jackets">Jackets</button>
    </div>

    <!-- Product Count & Feedback -->
    <div class="flex justify-between items-center py-4 text-xs font-semibold text-secondary">
      <span id="product-count">Loading products...</span>
      <span class="hidden sm:inline">Handcrafted &middot; Free shipping over ₹2,500</span>
    </div>

    <!-- Product Grid -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 pt-2 pb-16">
      <!-- Dynamic Products -->
      <div class="aspect-[3/4] bg-surface-container rounded-xl animate-pulse"></div>
      <div class="aspect-[3/4] bg-surface-container rounded-xl animate-pulse"></div>
      <div class="aspect-[3/4] bg-surface-container rounded-xl animate-pulse"></div>
      <div class="aspect-[3/4] bg-surface-container rounded-xl animate-pulse"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-black text-white py-12 mt-12">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="text-sm font-bold uppercase tracking-tight">HARRY &amp; CO JEANS</span>
        <p class="text-xs text-white/60">Japanese &amp; Italian Selvedge Atelier</p>
      </div>
      <div class="flex gap-6 text-xs text-white/80">
        <a href="/shop" class="hover:underline">Catalog</a>
        <a href="/selvedge" class="hover:underline">Selvedge Series</a>
        <a href="/help" class="hover:underline">Denim Care</a>
        <a href="/admin/login" class="hover:underline">Admin</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { api, qsFromParams } from '/assets/js/core/api.js';
    import { money } from '/assets/js/core/format.js';
    import { params } from '/assets/js/core/ui.js';
    import { initChrome } from '/assets/js/components/chrome.js';

    await initChrome();

    const urlParams = params();
    let currentFit = urlParams.fit || 'all';
    let currentType = urlParams.type || 'all';
    let currentSort = urlParams.sort || 'recommended';
    let searchQuery = urlParams.q || '';

    const grid = document.getElementById('products-grid');
    const countEl = document.getElementById('product-count');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');

    if (searchQuery) searchInput.value = searchQuery;
    if (currentSort) sortSelect.value = currentSort;

    // Highlight active chip
    function updateChipsUI() {
      document.querySelectorAll('.filter-chip').forEach(btn => {
        const fit = btn.dataset.fit;
        const type = btn.dataset.type;
        let isActive = false;
        if (fit && fit === currentFit && currentType === 'all') isActive = true;
        if (type && type === currentType) isActive = true;

        if (isActive) {
          btn.className = 'filter-chip active px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-primary text-on-primary';
        } else {
          btn.className = 'filter-chip px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-surface-container text-primary hover:bg-surface-container-high';
        }
      });
    }

    async function loadProducts() {
      grid.innerHTML = '<div class="col-span-full py-16 text-center text-secondary">Loading products...</div>';
      try {
        const queryObj = {
          sort: currentSort,
          fit: currentFit !== 'all' ? currentFit : undefined,
          type: currentType !== 'all' ? currentType : undefined,
          q: searchQuery || undefined,
        };

        const res = await api.get('/products' + qsFromParams(queryObj));
        const products = res.products || [];

        countEl.textContent = `Showing ${products.length} product${products.length === 1 ? '' : 's'}`;

        if (!products.length) {
          grid.innerHTML = `
            <div class="col-span-full py-16 text-center">
              <span class="material-symbols-outlined text-[48px] text-secondary mb-2">search_off</span>
              <p class="text-base font-bold text-primary mb-1">No matching products found</p>
              <p class="text-xs text-secondary mb-4">Try clearing filters or search term</p>
              <button id="reset-filters" class="bg-primary text-on-primary text-xs font-bold px-4 py-2 rounded-lg uppercase">Clear Filters</button>
            </div>
          `;
          document.getElementById('reset-filters')?.addEventListener('click', () => {
            currentFit = 'all';
            currentType = 'all';
            searchQuery = '';
            searchInput.value = '';
            updateChipsUI();
            loadProducts();
          });
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="group flex flex-col bg-white border border-outline-variant/60 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
            <a href="/product?slug=${encodeURIComponent(p.slug)}" class="block relative aspect-[3/4] bg-surface-container overflow-hidden">
              <img src="${p.mainImage || 'https://lh3.googleusercontent.com/aida-public/AB6AXuDdfwemnRapY-vyeAjWEz3r219w81Ab4vPUNY7KyrOw2iNHjkB83Va2Ag99ZUTaGZ9TA3BDtN5IaYBopnZCE08sNwD50gVcutAa6cN9rWQMptFBt9D9Ckf_MtryPuTqxm6_5GRRpNYMKvuBo2dNkFdygGhFMvgNODE1699fIMFv6wpsNDQbhd-J9BKesbicsQhnElFKF9vsZRmR5o2HOEjtIbZ9_M17CIsW6EEh2tUQ7ehOft19sNcN'}"
                   alt="${p.title}"
                   class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
              ${p.isNew ? '<span class="absolute top-3 left-3 bg-black text-white text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded">New</span>' : ''}
              <span class="absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm text-black text-[10px] font-bold px-2 py-0.5 rounded shadow">
                ${p.variants?.length ? `${p.variants.length} Sizes` : 'In Stock'}
              </span>
            </a>
            <div class="p-4 flex flex-col flex-1">
              <div class="flex justify-between items-start gap-1 mb-1">
                <span class="text-[11px] font-bold uppercase tracking-wider text-secondary">${p.fit || 'Classic'} &middot; ${p.productType || 'Jeans'}</span>
                <span class="flex items-center text-[11px] font-semibold text-primary">
                  <span class="material-symbols-outlined text-[14px] text-amber-500 fill-1">star</span> ${p.rating || '5.0'}
                </span>
              </div>
              <h3 class="font-bold text-sm text-primary mb-2 line-clamp-1 group-hover:underline">
                <a href="/product?slug=${encodeURIComponent(p.slug)}">${p.title}</a>
              </h3>
              <p class="text-xs text-secondary line-clamp-2 mb-3 leading-relaxed">${p.description || ''}</p>
              <div class="mt-auto pt-2 flex items-center justify-between border-t border-outline-variant/40">
                <div>
                  <span class="font-bold text-base text-primary">${money(p.basePrice)}</span>
                  ${p.compareAtPrice ? `<span class="text-xs text-secondary line-through ml-1.5">${money(p.compareAtPrice)}</span>` : ''}
                </div>
                <a href="/product?slug=${encodeURIComponent(p.slug)}" class="bg-primary text-on-primary text-xs font-bold uppercase tracking-wider px-3.5 py-1.5 rounded-lg hover:bg-black/80 transition">
                  Select Size
                </a>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-error">Failed to load catalog.</div>';
      }
    }

    // Filter chip clicks
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.fit) {
          currentFit = btn.dataset.fit;
          currentType = 'all';
        } else if (btn.dataset.type) {
          currentType = btn.dataset.type;
          currentFit = 'all';
        }
        updateChipsUI();
        loadProducts();
      });
    });

    // Search input with debounce
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        loadProducts();
      }, 350);
    });

    // Sort select
    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      loadProducts();
    });

    updateChipsUI();
    loadProducts();
  </script>
</body>
</html>
