<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Order History — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased pt-20 pb-20 md:pb-12">

  <!-- Header -->
  <header class="bg-background/95 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant">
    <div class="flex justify-between items-center px-4 md:px-8 h-20 w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-4">
        <button aria-label="Menu" class="text-primary hover:opacity-70 p-2 rounded-lg hover:bg-surface-container transition">
          <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <a href="/shop" class="text-label-sm font-semibold tracking-wider uppercase hover:text-secondary hidden sm:inline">Shop All</a>
      </div>

      <a href="/" class="text-headline-md font-headline-md font-bold tracking-tighter text-primary uppercase text-center">
        HARRY &amp; CO
      </a>

      <div class="flex items-center gap-2">
        <a href="/account" class="text-primary hover:opacity-70 p-2 rounded-lg hover:bg-surface-container transition">
          <span class="material-symbols-outlined text-[22px]">person</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-8">
    <div class="flex justify-between items-end mb-8 border-b border-outline-variant pb-4">
      <div>
        <p class="text-xs uppercase tracking-widest font-bold text-secondary mb-1">ACCOUNT OVERVIEW</p>
        <h1 class="text-2xl sm:text-3xl font-headline-lg font-bold text-primary">YOUR ORDER HISTORY</h1>
      </div>
      <a href="/account" class="text-xs font-bold text-secondary hover:text-primary">&larr; Account Dashboard</a>
    </div>

    <div id="orders-container" class="space-y-4 pb-16">
      <div class="py-16 text-center text-secondary">
        <span class="material-symbols-outlined text-[36px] animate-spin mb-2">progress_activity</span>
        <p class="text-sm">Loading your orders...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { api } from '/assets/js/core/api.js';
    import { money } from '/assets/js/core/format.js';
    import { requireCustomer } from '/assets/js/core/auth.js';
    import { initChrome } from '/assets/js/components/chrome.js';

    await initChrome();
    const user = await requireCustomer();
    if (!user) {
      // redirected to login
    } else {
      loadOrders();
    }

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      try {
        const res = await api.get('/orders');
        const orders = res.orders || [];

        if (!orders.length) {
          container.innerHTML = `
            <div class="py-16 text-center bg-white rounded-2xl border border-outline-variant p-8">
              <span class="material-symbols-outlined text-[48px] text-secondary mb-2">receipt_long</span>
              <h2 class="text-lg font-bold text-primary mb-1">No Orders Placed Yet</h2>
              <p class="text-xs text-secondary mb-4">When you purchase from our selvedge denim collection, your orders will appear here.</p>
              <a href="/shop" class="inline-block bg-primary text-on-primary text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-lg hover:bg-black/80 transition">
                Start Shopping
              </a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(ord => `
          <div class="bg-white border border-outline-variant rounded-2xl p-6 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-outline-variant/60 pb-3 gap-2">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-base text-primary">${ord.orderNumber}</span>
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${
                    ord.status === 'delivered' ? 'bg-emerald-100 text-emerald-800' :
                    ord.status === 'cancelled' ? 'bg-error-container text-on-error-container' :
                    'bg-surface-container-high text-primary'
                  }">${ord.status}</span>
                </div>
                <p class="text-xs text-secondary mt-0.5">Placed on ${new Date(ord.placedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</p>
              </div>

              <div class="text-left sm:text-right">
                <span class="text-sm font-bold text-primary">${money(ord.total)}</span>
                <p class="text-[11px] text-secondary capitalize">${ord.paymentMethod} &middot; ${ord.paymentStatus}</p>
              </div>
            </div>

            <!-- Items -->
            <div class="divide-y divide-outline-variant/30">
              ${(ord.items || []).map(it => `
                <div class="flex items-center gap-3 py-2 text-xs">
                  <img src="${it.imageUrl || ''}" class="w-12 h-14 object-cover bg-surface-container rounded-lg flex-shrink-0"/>
                  <div class="flex-1">
                    <h4 class="font-bold text-primary">${it.name}</h4>
                    <p class="text-secondary">Size: ${it.size} &middot; Qty: ${it.quantity}</p>
                  </div>
                  <span class="font-semibold text-primary">${money(it.unitPrice * it.quantity)}</span>
                </div>
              `).join('')}
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-outline-variant/40">
              <span class="text-xs text-secondary">Est. Delivery: ${ord.estimatedDelivery || '4-5 business days'}</span>
              <a href="/order-confirmed?order=${encodeURIComponent(ord.orderNumber)}" class="text-xs font-bold uppercase tracking-wider text-primary underline hover:opacity-70">
                View Receipt &amp; Tracking &rarr;
              </a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<p class="text-error font-bold text-center py-12">${err.message || 'Failed to load order history.'}</p>`;
      }
    }
  </script>
</body>
</html>
