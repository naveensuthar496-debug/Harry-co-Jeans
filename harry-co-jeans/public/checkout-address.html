<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Checkout Shipping Address — HARRY &amp; CO JEANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/assets/tailwind.config.js"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased pt-16 pb-20">

  <!-- Simple Checkout Header -->
  <header class="bg-white border-b border-outline-variant fixed top-0 w-full z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="text-lg font-bold tracking-tighter uppercase text-primary">HARRY &amp; CO</a>
      <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
        <span class="text-primary border-b-2 border-primary pb-0.5">1. Address</span>
        <span class="text-secondary">&rarr;</span>
        <span class="text-secondary">2. Payment</span>
        <span class="text-secondary">&rarr;</span>
        <span class="text-secondary">3. Confirmed</span>
      </div>
      <a href="/bag" class="text-xs text-secondary hover:text-primary">Cancel</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-8">
    <div class="mb-6">
      <span class="text-xs font-bold uppercase tracking-widest text-secondary">STEP 1 OF 2</span>
      <h1 class="text-2xl font-headline-lg font-bold text-primary">SHIPPING DESTINATION</h1>
    </div>

    <!-- Saved Addresses Selector (if logged in) -->
    <div id="saved-addresses-wrap" class="hidden mb-8">
      <h2 class="text-xs font-bold uppercase tracking-wider text-primary mb-3">YOUR SAVED ADDRESSES</h2>
      <div id="saved-addresses-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4"></div>
      <div class="text-right">
        <button id="btn-use-new-address" class="text-xs font-bold text-primary underline">+ Enter a new address</button>
      </div>
    </div>

    <!-- Address Form -->
    <form id="address-form" class="bg-white border border-outline-variant rounded-2xl p-6 shadow-sm space-y-4">
      <h2 class="text-sm font-bold uppercase tracking-wider text-primary border-b border-outline-variant/60 pb-3">RECIPIENT &amp; DELIVERY DETAILS</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Full Name *</label>
          <input type="text" name="fullName" required placeholder="e.g. Arjun Verma" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">Phone Number *</label>
          <input type="tel" name="phone" required placeholder="e.g. +91 98765 43210" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-secondary mb-1">Address Line 1 (House/Flat, Street) *</label>
        <input type="text" name="line1" required placeholder="e.g. Flat 402, Signature Residency, 12th Main" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-secondary mb-1">Address Line 2 (Apartment, Landmark)</label>
        <input type="text" name="line2" placeholder="e.g. Near Indiranagar Metro Station" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">City *</label>
          <input type="text" name="city" required placeholder="Bengaluru" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-secondary mb-1">State *</label>
          <input type="text" name="state" required placeholder="Karnataka" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold uppercase text-secondary mb-1">PIN / ZIP Code *</label>
          <input type="text" name="zip" required placeholder="560038" class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 text-sm focus:outline-none focus:border-primary"/>
        </div>
      </div>

      <div class="pt-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="saveAddress" checked class="rounded border-outline-variant text-primary focus:ring-primary"/>
          <span class="text-xs text-secondary">Save this address to my profile for future orders</span>
        </label>
      </div>

      <div class="pt-4 border-t border-outline-variant flex justify-between items-center">
        <a href="/bag" class="text-xs font-bold text-secondary hover:text-primary">&larr; Return to Bag</a>
        <button type="submit" class="bg-primary text-on-primary text-xs font-bold uppercase tracking-wider px-8 py-3.5 rounded-lg hover:bg-black/80 transition shadow-lg">
          CONTINUE TO PAYMENT &rarr;
        </button>
      </div>
    </form>
  </main>

  <script type="module">
    import { api } from '/assets/js/core/api.js';
    import { toast } from '/assets/js/core/ui.js';
    import { currentUser } from '/assets/js/core/auth.js';

    const form = document.getElementById('address-form');
    const savedWrap = document.getElementById('saved-addresses-wrap');
    const savedList = document.getElementById('saved-addresses-list');

    const user = await currentUser();

    if (user) {
      form.elements.fullName.value = user.fullName || '';
      form.elements.phone.value = user.phone || '';

      // Fetch saved addresses
      try {
        const res = await api.get('/addresses');
        const addresses = res.addresses || [];
        if (addresses.length > 0) {
          savedWrap.classList.remove('hidden');
          savedList.innerHTML = addresses.map((a, idx) => `
            <div class="address-card p-4 rounded-xl border-2 ${idx === 0 ? 'border-primary bg-surface-container-low' : 'border-outline-variant/60 bg-white'} cursor-pointer transition hover:border-primary" data-json='${JSON.stringify(a)}'>
              <div class="flex justify-between items-start">
                <span class="font-bold text-xs text-primary">${a.fullName}</span>
                ${a.isDefault ? '<span class="text-[9px] bg-black text-white px-1.5 py-0.5 rounded uppercase font-bold">Default</span>' : ''}
              </div>
              <p class="text-xs text-secondary mt-1">${a.line1}, ${a.city}, ${a.state} - ${a.zip}</p>
              <p class="text-xs text-secondary mt-0.5">${a.phone}</p>
            </div>
          `).join('');

          // Select first
          fillFormFromAddress(addresses[0]);

          document.querySelectorAll('.address-card').forEach(card => {
            card.addEventListener('click', () => {
              document.querySelectorAll('.address-card').forEach(c => {
                c.className = 'address-card p-4 rounded-xl border-2 border-outline-variant/60 bg-white cursor-pointer transition hover:border-primary';
              });
              card.className = 'address-card p-4 rounded-xl border-2 border-primary bg-surface-container-low cursor-pointer transition';
              fillFormFromAddress(JSON.parse(card.dataset.json));
            });
          });
        }
      } catch (err) {
        // ignore
      }
    }

    function fillFormFromAddress(a) {
      form.elements.fullName.value = a.fullName || a.full_name || '';
      form.elements.phone.value = a.phone || '';
      form.elements.line1.value = a.line1 || '';
      form.elements.line2.value = a.line2 || '';
      form.elements.city.value = a.city || '';
      form.elements.state.value = a.state || '';
      form.elements.zip.value = a.zip || '';
    }

    document.getElementById('btn-use-new-address')?.addEventListener('click', () => {
      form.reset();
      if (user) {
        form.elements.fullName.value = user.fullName || '';
        form.elements.phone.value = user.phone || '';
      }
      form.elements.line1.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const shippingAddress = {
        fullName: form.elements.fullName.value.trim(),
        phone: form.elements.phone.value.trim(),
        line1: form.elements.line1.value.trim(),
        line2: form.elements.line2.value.trim(),
        city: form.elements.city.value.trim(),
        state: form.elements.state.value.trim(),
        zip: form.elements.zip.value.trim(),
        country: 'India',
      };

      // Save to localStorage for the next checkout step
      sessionStorage.setItem('hc_shipping_address', JSON.stringify(shippingAddress));

      if (form.elements.saveAddress.checked && user) {
        try {
          await api.post('/addresses', shippingAddress);
        } catch { /* ignore duplicate */ }
      }

      location.href = '/checkout-payment';
    });
  </script>
</body>
</html>
